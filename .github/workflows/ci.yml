name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The engine links against lzma and bz2 when it compiles its install
      # probe, and shells out to clang for every program it builds.
      - name: Engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang liblzma-dev libbz2-dev

      # The engine ships prebuilt tarballs per target; the installer verifies
      # the checksum and compiles a probe program before reporting success.
      - name: Install the Tallow engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/aamirmanisa/tallowsphere/main/install.sh \
            | bash -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Engine version
        run: tallow --version

      # The tool's core paths run on any 1.5.x engine; --resume needs the build
      # that added fs.copy_range and Transfer.hash_prefix. Assert it here so a
      # release that loses the primitives fails CI loudly, instead of the test
      # suite quietly skipping the resume cases (see the probe in tests/).
      - name: Engine has the resume primitives
        run: |
          cat > /tmp/resume-probe.tl <<'TL'
          fn main() {
              fs.write_file("/tmp/probe.src", "0123456789abcdef")?
              fs.copy_range("/tmp/probe.src", "/tmp/probe.dst", 8, 8)
              let h = Transfer.hash_prefix("/tmp/probe.src", 4)
              print("ok " + h.len().to_string())
          }
          TL
          out=$(tallow run /tmp/resume-probe.tl --interpret)
          echo "$out"
          case "$out" in
            *"ok 64"*) echo "resume primitives present" ;;
            *) echo "::error::engine lacks fs.copy_range / Transfer.hash_prefix — --resume cannot work"; exit 1 ;;
          esac

      - name: Type-check the tool
        run: tallow check tallowx.tl

      - name: End-to-end smoke tests
        run: ./tests/smoke.sh

  native:
    # The tool ships two planes, and until this job existed CI only exercised
    # one: a codegen regression could pass every gate above and still break the
    # binary users are told to prefer. This builds it and runs the same fixtures
    # against the executable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang liblzma-dev libbz2-dev

      - name: Install the Tallow engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/aamirmanisa/tallowsphere/main/install.sh \
            | bash -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Engine version
        run: tallow --version

      - name: Build the native binary and run the suite against it
        env:
          TALLOW: tallow
        run: ./tests/native.sh
