name: ci

# This repository is packaging + assets only: the implementation (tallowx.tl)
# is built by the Tallow engine (aamirmanisa/tallowsphere).
#
# The engine is PUBLIC as of 2026-11-02, so the engine checkout is an ordinary
# anonymous clone of a pinned commit and needs no token. The token existed
# because the repository was private; before that this file fetched install.sh
# from raw.githubusercontent.com and piped it to bash — a URL that returned
# HTTP 404 for a private repository, and that would have installed an unpinned
# "latest" engine had it resolved.
#
# What still matters is the PIN. The engine commit is a variable, not "latest":
# a green run identifies exactly which engine produced it, and bumping it is a
# deliberate change made in the same commit that re-measures the tool.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TALLOW_ENGINE_REPO: aamirmanisa/tallowsphere
  # The 1.7.1 release commit (tag v1.7.1). Bump deliberately, in the same change
  # that re-measures the tool against it.
  TALLOW_ENGINE_SHA: 327a116f039df9b0fbf55c742082e3b81121d334
  TALLOW_ENGINE_VERSION: "1.7.1"

jobs:
  build-engine:
    name: Build the pinned engine
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.TALLOW_ENGINE_REPO }}
          ref: ${{ env.TALLOW_ENGINE_SHA }}
          path: engine

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev libbz2-dev

      - name: Build the engine (binary + runtime archive)
        working-directory: engine
        run: |
          set -euo pipefail
          cargo build --locked --release --bin tallow
          cargo build --locked --release --lib

      - name: Package the engine pair for the other jobs
        run: |
          set -euo pipefail
          tar czf engine.tar.gz -C engine/target/release tallow libtallow.a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-bin
          path: engine.tar.gz
          retention-days: 3

  test:
    name: Interpreter plane (smoke)
    needs: build-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-bin
      - name: Install the pinned engine
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tar xzf engine.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Engine version is the pinned one
        run: |
          set -euo pipefail
          got="$(tallow --version | head -1)"
          echo "$got"
          case "$got" in
            *"$TALLOW_ENGINE_VERSION"*) echo "engine $TALLOW_ENGINE_VERSION confirmed" ;;
            *) echo "::error::expected engine $TALLOW_ENGINE_VERSION, got: $got"; exit 1 ;;
          esac
      - name: Engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang liblzma-dev libbz2-dev
      - name: Type-check the tool
        run: tallow check tallowx.tl
      - name: End-to-end smoke tests
        run: ./tests/smoke.sh

  smoke-matrix:
    name: Published engine (${{ matrix.label }})
    # The Linux lane above builds the pinned COMMIT, which proves the pin is
    # buildable. This job proves the other half: that the artifact users actually
    # download runs the tool, on all three operating systems. It fetches the
    # PUBLISHED asset for the pinned version, verifies it against the release's
    # own sha256 sidecar, and only then runs the same smoke suite. A rebuild would
    # prove the commit compiles; this proves the release is usable.
    #
    # No `needs: build-engine`: these jobs consume a published artifact, not the
    # artifact that job builds. Depending on it made four download-and-run jobs
    # wait ~30 minutes behind a from-scratch engine compile they never touched.
    # build-engine still runs, because "the pinned commit compiles" is worth
    # proving — it just no longer gates anything that does not need it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            asset: tallow-linux-x86_64-${{ env.TALLOW_ENGINE_VERSION }}.tar.gz
            binary: tallow
          - label: macos-aarch64
            os: macos-15
            asset: tallow-macos-aarch64-${{ env.TALLOW_ENGINE_VERSION }}.tar.gz
            binary: tallow
          - label: macos-x86_64
            # macos-13 is the x86_64 image; macos-15 is arm64 and cannot execute
            # the x86_64 Mach-O, so the arm64 entry above and this one together
            # cover both macOS artifacts the release ships.
            os: macos-13
            asset: tallow-macos-x86_64-${{ env.TALLOW_ENGINE_VERSION }}.tar.gz
            binary: tallow
          - label: windows-x86_64
            os: windows-latest
            asset: tallow-windows-x86_64-${{ env.TALLOW_ENGINE_VERSION }}.zip
            binary: tallow.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch and verify the published engine
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ env.TALLOW_ENGINE_VERSION }}
          REPO: ${{ env.TALLOW_ENGINE_REPO }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, tarfile, urllib.request, zipfile

          asset = os.environ["ASSET"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/v{version}"

          def fetch(url, dest):
              with urllib.request.urlopen(url, timeout=120) as r, open(dest, "wb") as f:
                  while chunk := r.read(1 << 20):
                      f.write(chunk)

          fetch(f"{base}/{asset}", asset)
          fetch(f"{base}/{asset}.sha256", asset + ".sha256")

          want = open(asset + ".sha256").read().split()[0].lower()
          got = hashlib.sha256(open(asset, "rb").read()).hexdigest()
          if want != got:
              raise SystemExit(f"checksum mismatch: sidecar {want}, downloaded {got}")
          print(f"sha256 ok  {asset}  {got}")

          os.makedirs("engine", exist_ok=True)
          if asset.endswith(".zip"):
              with zipfile.ZipFile(asset) as z:
                  z.extractall("engine")
          else:
              with tarfile.open(asset) as t:
                  t.extractall("engine")
          print("extracted:", sorted(os.listdir("engine")))
          PY
      - name: Interpreter plane (smoke) against the published engine
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          TALLOW="$(pwd)/engine/${BINARY}"
          test -x "$TALLOW" || { echo "::error::no executable at $TALLOW"; exit 1; }
          "$TALLOW" --version
          TALLOW="$TALLOW" bash tests/smoke.sh

  native:
    name: Native plane
    needs: build-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-bin
      - name: Install the pinned engine
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tar xzf engine.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang liblzma-dev libbz2-dev
      - name: Build the native binary and run the suite against it
        env:
          TALLOW: tallow
        run: ./tests/native.sh

  packaging:
    name: Arch recipe
    # packaging/arch/verify-recipe.sh existed but no workflow ever ran it, so the
    # recipe this repository ships was untested. It builds the tool from the
    # recipe's own steps and runs the installed binary outside the source tree.
    needs: build-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-bin
      - name: Install the pinned engine
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tar xzf engine.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang liblzma-dev libbz2-dev
      - name: Verify the recipe end to end
        run: ./packaging/arch/verify-recipe.sh
